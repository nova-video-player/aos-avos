# Builds the native (sim) target on Linux and macOS, so the host build keeps working
# without anyone needing both platforms locally. The sim build links the real decoder,
# demuxer, audio and subtitle code against the host's FFmpeg/libass/freetype/SDL2/libzip.
name: avos sim build

on:
  push:
  pull_request:
  workflow_dispatch:   # manual: GitHub -> Actions -> "avos sim build" -> Run workflow

jobs:
  sim-build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libass-dev libfreetype-dev libsdl2-dev libzip-dev zlib1g-dev

      # The sources need FFmpeg >= 7.1 (sws_free_context, AV_CHAN_SIDE_SURROUND_*) but
      # Ubuntu 24.04 only ships 6.1, so Linux gets FFmpeg 9 from conda-forge instead.
      - name: Install FFmpeg 9 (Linux)
        if: runner.os == 'Linux'
        run: |
          export MAMBA_ROOT_PREFIX="$HOME/micromamba"
          curl -fsSL https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C /tmp bin/micromamba
          /tmp/bin/micromamba create -y -q -n ffmpeg9 -c conda-forge --override-channels "ffmpeg=9"
          P="$MAMBA_ROOT_PREFIX/envs/ffmpeg9"
          ln -sfn "$P/lib" "$P/lib64"          # Makefile looks in $(TOOLCHAIN_PATH)/lib64
          echo "FFMPEG_PREFIX=$P" >> "$GITHUB_ENV"
          # LD_LIBRARY_PATH is deliberately NOT exported for later steps: conda's libs
          # (curl, ssl, zlib, ...) would shadow the system ones used by git and friends.

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libass freetype sdl2 libzip ffmpeg pkgconf

      # codecs.mk expects the audio compressor as a sibling of this repository and
      # builds it on demand (ARCH is the host architecture for the sim target).
      - name: Fetch audiocompress
        run: git clone --depth 1 https://github.com/nova-video-player/aos-audiocompress.git ../audiocompress

      - name: Show toolchain
        run: |
          cc --version | head -1
          pkg-config --modversion libass

      - name: Build sim target
        run: make -j"$(getconf _NPROCESSORS_ONLN)" ${FFMPEG_PREFIX:+TOOLCHAIN_PATH="$FFMPEG_PREFIX"}

      - name: Check the binary was produced
        run: test -x build/avos

      - name: Check the binary links FFmpeg 9 (Linux)
        if: runner.os == 'Linux'
        run: |
          out="$(LD_LIBRARY_PATH="$FFMPEG_PREFIX/lib" ldd build/avos)"
          echo "$out" | grep -E 'libav|libsw'
          if grep -q 'not found' <<< "$out"; then
            echo "$out"
            exit 1
          fi
          echo "$out" | grep -q "libavcodec.so.63 => $FFMPEG_PREFIX/lib/"
